[package]
name = "ticket-summary"
version = "0.1.0"
edition = "2021"
description = "Support ticket summaries with async-openai. Teire demo repository."
license = "MIT"
publish = false

[dependencies]
async-openai = { version = "0.42.2", default-features = false, features = ["rustls", "chat-completion"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
serde_json = "1"
