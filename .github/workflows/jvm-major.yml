name: jvm-major
on:
  push:
    paths: ["jvm-major/**", ".github/workflows/jvm-major.yml"]
  pull_request:
    paths: ["jvm-major/**", ".github/workflows/jvm-major.yml"]
defaults:
  run:
    working-directory: jvm-major
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B verify
