name: kotlin-major
on:
  push:
    paths: ["kotlin-major/**", ".github/workflows/kotlin-major.yml"]
  pull_request:
    paths: ["kotlin-major/**", ".github/workflows/kotlin-major.yml"]
defaults:
  run:
    working-directory: kotlin-major
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew build
